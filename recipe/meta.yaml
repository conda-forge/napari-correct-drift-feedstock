{% set name = "napari-correct-drift" %}
{% set version = "0.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: e83b86c05b2a77b05b11919032891e2ed7a804d36a8c2d4c8982b4b5c1cb1c99

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.8
  run:
    - dask-core
    - napari
    - numpy
    - pandas
    - python >=3.8
    - qtpy
    - scikit-image
    - scipy

test:
  imports:
    - napari_correct_drift
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - pyqt

about:
  home: https://pypi.org/project/napari-correct-drift
  summary: Drift correction 2D/3D for Napari similar to Fijis Correct 3D drift
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/sommerc/napari-correct-drift

extra:
  recipe-maintainers:
    - jaimergp
